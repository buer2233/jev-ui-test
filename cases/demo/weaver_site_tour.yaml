# 通用演示用例：跑在公开网站上，不需要 E9 环境、不需要登录、不需要 config.json。
#
# 它的用途有两个：
#   1. 给新同事看「一条自然语言用例长什么样」——从搜索到进入官网再到逐页浏览，
#      全程只有自然语言，没有一行选择器或站点脚本；
#   2. 作为项目的对外演示 demo，任何有网的环境都能复现。
# 起始地址写的是公开站点，不含任何内网信息（本仓库是公开仓库）。
#
# 设计约束（写之前先读一遍，改的时候别破坏）：
#   · 断言只对【终局页面】求值，中间步骤做过什么终局断言看不见 —— 所以「客户案例」
#     刻意排在最后一站，让"搜索确实发出去了"这件事落在终局页面上（URL + 结果文案）。
#     ⚠️ 推论：中间几站（产品体系 / 办公产品 / 解决方案 / 行业方案 / 关于泛微 / 泛微动态）
#     是【走过但没被单独断言】的。实测 agent 会漏掉其中一站——有一次它从「解决方案」
#     直接去了「关于泛微」，把「行业方案」跳过了，而三条断言照样全绿（实测动作序列：
#     8 次 CLICK + 1 次 TYPE_TEXT，共 9 个浏览器动作）。要逐站验证，只能把每一站
#     拆成独立用例：一条用例只对它的终局页面负责。
#   · agent 没有"后退"动作，路径只能前进。每页顶部的全局导航栏是唯一的枢纽，
#     因此站点内换页一律走顶部导航，不走浏览器历史。
version: 1

defaults:
  login: none
  epic: 未分类
  feature: 通用演示
  timeout_s: 600
  max_steps: 40

cases:
  - id: demo-weaver-site-tour
    name: 通用演示 · 百度搜索泛微网络并浏览官网各页面
    tags: [demo, open-web, smoke]
    severity: critical
    login: none
    # 起点直接落在「百度搜索泛微网络」的结果页，而不是百度首页。
    #
    # 为什么不从首页起步（实测，2026-09）：这个 Chrome profile 上百度首页渲染的是
    # 【AI 对话界面】，真正的搜索框 #kw 与「百度一下」#su 都是 0×0 不可见，
    # 唯一可见的 textbox 是 AI 对话输入框 #chat-textarea（坐标为 177,197），
    # 而它的可访问名来自 placeholder —— 内容是当天的热搜词，一条与搜索无关的新闻标题。
    # 于是 goal 说"在搜索输入框里输入泛微网络"，模型只能落在那个框上，而文本助手看到
    # 字段名是一条新闻标题，判定"goal 要的值不在这个字段上"，返回 {"text": null}
    # （同一输入连测两次都是 null，而把字段名换成正常占位符就连测两次都正确）。
    # 这是可复现的确定性阻塞，不是抖动，所以起点后移到结果页。
    url: "https://www.baidu.com/s?wd=泛微网络&ie=utf-8"
    goal: |
      当前打开的是百度搜索「泛微网络」的结果页。请从搜索结果进入泛微网络的官方网站，
      然后依次浏览官网的各个栏目：

      1. 在百度搜索结果页里向下滚动，找到指向泛微官网（网址是 www.weaver.com.cn）的那条搜索结果，点击它进入泛微官网首页；
      2. 在官网顶部导航栏里点击「产品体系」，进入产品体系页面；
      3. 在产品体系页面的栏目标签里点击「办公产品」；
      4. 在官网顶部导航栏里点击「解决方案」，进入解决方案页面；
      5. 在解决方案页面的栏目标签里点击「行业方案」；
      6. 在官网顶部导航栏里点击「关于泛微」，进入关于泛微页面；
      7. 在关于泛微页面的栏目标签里点击「泛微动态」；
      8. 在官网顶部导航栏里点击「客户案例」，进入客户案例页面；
      9. 在客户案例页面的搜索框里输入「制造」，并提交这次搜索；
      10. 当页面显示出与「制造」相关的客户案例搜索结果列表时停止。
      <!-- 第 9 步刻意写成"提交搜索"而不是"不要提交"：实测 agent 会自己找到并把搜索发出去
           （那个提交入口是一个算不出可访问名的 <a>，元素表里 label 就是 "link"），
           与其跟它的自然行为对抗，不如顺着它设计收尾——收尾状态因此是搜索结果页，
           断言也就锚在搜索结果上。 -->
    expect_mode: and
    expect:
      # 语义断言：Jev 的 noul 给概率，阈值比较留在代码里（默认 0.75）。
      # 实测这条能拿到 noul=0.970。
      - type: ai
        desc: 已进入泛微客户案例的搜索结果列表
        claim: 页面上显示的是泛微网络的客户案例搜索结果，列出了与"制造"相关的客户案例
      # 确定性断言：路径落在客户案例的搜索路由上（该站把 search 拼成了 toSeach，
      # 这是它自己的拼写；若哪天站点改正了拼写，这条断言会失败，那正是它该做的）。
      - type: url_contains
        value: "/case/toSeach"
      # 确定性断言：这是搜索结果页特有的文案（案例库首页没有这句）
      - type: text_contains
        value: "为您搜索到"

  # 负向对照：官网上没有"泛微东京分公司"这个内容，这条必须【失败】。
  # 它不证明功能，只证明一件事：框架会如实报错，而不是幻觉成功。
  # 用确定性的 text_contains 而不是 ai，是为了让这条对照的失败是【必然且免费】的：
  # 不调用语义模型，也不依赖模型判断，失败原因一眼可见。
  - id: demo-negative-missing-content
    name: 通用演示 · 负向对照（应失败）
    tags: [demo, negative]
    severity: minor
    login: none
    # 设计上就该失败，重跑只是白跑一遍还要再花一次决策调用。
    reruns: 0
    url: "https://www.weaver.com.cn/"
    goal: |
      打开泛微官网首页，等首页的主要内容显示出来之后停止。
    expect_mode: and
    expect:
      - type: text_contains
        value: "泛微东京分公司"